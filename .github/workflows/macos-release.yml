name: macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-sign-notarize:
    name: Build, sign, and notarize Hush
    runs-on: macos-14
    env:
      HUSH_VERSION: ${{ github.ref_name }}
      HUSH_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      HUSH_NOTARY_PROFILE: Hush Notary
      KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Confirm the Apple Silicon release architecture
        run: test "$(uname -m)" = "arm64"

      - name: Determine whether release signing is enabled
        id: signing_mode
        env:
          SIGNING_DISABLED: ${{ vars.MACOS_SKIP_SIGNING }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail

          if [[ "${SIGNING_DISABLED:-}" == "true" ]]; then
            echo "signing_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unsigned release::Signing disabled by vars.MACOS_SKIP_SIGNING=true; building unsigned DMG."
            exit 0
          fi

          required=(
            SIGNING_IDENTITY
            KEYCHAIN_PASSWORD
            CERTIFICATE_BASE64
            CERTIFICATE_PASSWORD
            NOTARY_KEY_BASE64
            NOTARY_KEY_ID
            NOTARY_ISSUER_ID
          )
          missing=()
          for var in "${required[@]}"; do
            if [[ -z "${!var:-}" ]]; then
              missing+=("$var")
            fi
          done

          if (( ${#missing[@]} == 0 )); then
            echo "signing_enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Signed release::All signing and notarization secrets are present; signed flow enabled."
          else
            echo "signing_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned release::Missing signing inputs (${missing[*]}). Building unsigned DMG."
          fi

      - name: Import the Developer ID certificate
        if: ${{ steps.signing_mode.outputs.signing_enabled == 'true' }}
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/hush-certificate.p12"
          keychain_path="$RUNNER_TEMP/hush-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path" login.keychain-db
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
          rm -f "$certificate_path"

      - name: Configure notarization credentials
        if: ${{ steps.signing_mode.outputs.signing_enabled == 'true' }}
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          api_key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$api_key_path"
          xcrun notarytool store-credentials "$HUSH_NOTARY_PROFILE" \
            --key "$api_key_path" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          rm -f "$api_key_path"

      - name: Build the app bundle
        run: |
          set -euo pipefail
          export HUSH_VERSION="${HUSH_VERSION#v}"
          bash packaging/build_app.sh

      - name: Build, sign, notarize, and validate the DMG
        if: ${{ steps.signing_mode.outputs.signing_enabled == 'true' }}
        run: |
          set -euo pipefail
          export HUSH_VERSION="${HUSH_VERSION#v}"
          bash packaging/sign_and_notarize.sh dist/Hush.app

      - name: Build the unsigned DMG
        if: ${{ steps.signing_mode.outputs.signing_enabled != 'true' }}
        run: |
          set -euo pipefail
          export HUSH_VERSION="${HUSH_VERSION#v}"
          bash packaging/build_dmg.sh dist/Hush.app

      - name: Upload the release DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hush-release-dmg
          path: dist/Hush-*.dmg
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish the Hush release
    needs: build-sign-notarize
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hush-release-dmg
          path: release

      - name: Publish the release DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "release/Hush-$version.dmg" \
            --title "Hush $version" \
            --generate-notes
