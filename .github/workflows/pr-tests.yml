name: Pull request tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Application and rollback tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_NO_PROGRESS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential linux-libc-dev libgomp1 libportaudio2
          python -m pip install uv==0.8.22
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Test headless application and rollback paths
        run: |
          timeout 240s uv run --frozen pytest -q \
            tests/test_observability.py tests/test_managed_state.py \
            tests/test_web_transcription_api.py tests/test_container_artifacts.py \
            tests/test_orchestration_probes.py tests/test_storage_paths.py \
            tests/test_milestone6_pipeline.py
