name: hush

services:
  ollama:
    image: ollama/ollama:0.35.0
    profiles: ["ollama"]
    platform: linux/amd64
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - hush-private
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-model-init:
    image: ollama/ollama:0.35.0
    profiles: ["ollama"]
    platform: linux/amd64
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull "$${OLLAMA_MODEL}"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - hush-private

  hush:
    image: ${HUSH_IMAGE:-us-central1-docker.pkg.dev/hush-milestone-2-20260922/hush-containers/hush:v2.0.2}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    environment:
      HUSH_ALLOWED_HOSTS: ${HUSH_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-hush-milestone-2-20260922}
      HUSH_CLOUD_SQL_INSTANCE: ${HUSH_CLOUD_SQL_INSTANCE:-hush-milestone-2-20260922:us-central1:hush-postgres-m4}
      HUSH_DB_NAME: ${HUSH_DB_NAME:-hush}
      HUSH_DB_USER: ${HUSH_DB_USER:-hush_app}
      HUSH_DB_PASSWORD_SECRET: ${HUSH_DB_PASSWORD_SECRET:-hush-db-password}
      HUSH_TEAM_TOKEN_SECRET: ${HUSH_TEAM_TOKEN_SECRET:-hush-team-token}
      HUSH_UPLOAD_BUCKET: ${HUSH_UPLOAD_BUCKET:-hush-milestone-2-20260922-uploads}
      HUSH_OLLAMA_BASE_URL: http://ollama:11434
      HUSH_SERVER_MODE: cloud
      HUSH_WHISPER_BEAM_SIZE: ${HUSH_WHISPER_BEAM_SIZE:-1}
      HUSH_WHISPER_MODEL: ${HUSH_WHISPER_MODEL:-tiny.en}
      HF_HOME: /var/cache/hush/huggingface
      XDG_CACHE_HOME: /var/cache/hush
    ports:
      # Keep bearer-token traffic off the public network. Operators reach this
      # loopback listener through an encrypted SSH or IAP tunnel.
      - "127.0.0.1:57327:57327"
    volumes:
      - whisper-cache:/var/cache/hush
    tmpfs:
      - /app/data:size=16m,uid=10001,gid=10001,mode=0700
      - /tmp:size=64m,uid=10001,gid=10001,mode=1777
    networks:
      - hush-private
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:57327/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  ollama-models:
  whisper-cache:

networks:
  hush-private:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.240.0/24
