apiVersion: v1
kind: Service
metadata:
  name: hush
  namespace: hush
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default":"hush-backend"}'
spec:
  type: ClusterIP
  selector:
    app: hush
  ports:
    - name: http
      port: 80
      targetPort: http
