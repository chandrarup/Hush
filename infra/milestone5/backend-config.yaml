apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: hush-backend
  namespace: hush
spec:
  timeoutSec: 180
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    type: HTTP
    requestPath: /ready
    port: 57327
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 2
    unhealthyThreshold: 2
  logging:
    enable: true
    sampleRate: 0.1
