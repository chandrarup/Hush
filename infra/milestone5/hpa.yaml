apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hush
  namespace: hush
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hush
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
