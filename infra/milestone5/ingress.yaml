apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hush
  namespace: hush
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: hush-m5-ip
    networking.gke.io/managed-certificates: hush-cert-nip
    networking.gke.io/v1beta1.FrontendConfig: hush-frontend
spec:
  rules:
    - host: hush.34.36.104.111.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hush
                port:
                  number: 80
